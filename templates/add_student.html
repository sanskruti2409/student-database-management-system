{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Add New Student</h1>
    <p class="page-subtitle">Enter student personal and academic details to save to the database.</p>
  </div>
  <div>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">&larr; Back to Student List</a>
  </div>
</div>

<div class="card" style="max-width: 650px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('add_student') }}">
    
    <div class="form-row">
      <div class="form-group">
        <label for="first_name" class="form-label">First Name <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" class="form-control" required placeholder="e.g. Aarav">
      </div>

      <div class="form-group">
        <label for="last_name" class="form-label">Last Name <span class="required">*</span></label>
        <input type="text" id="last_name" name="last_name" class="form-control" required placeholder="e.g. Sharma">
      </div>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email Address <span class="required">*</span></label>
      <input type="email" id="email" name="email" class="form-control" required placeholder="e.g. student@example.edu">
      <div class="form-hint">Must be unique across all students.</div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="phone" class="form-label">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="e.g. 9876543210">
      </div>

      <div class="form-group">
        <label for="date_of_birth" class="form-label">Date of Birth</label>
        <input type="date" id="date_of_birth" name="date_of_birth" class="form-control">
      </div>
    </div>

    <div class="form-group">
      <label for="department_id" class="form-label">Academic Department</label>
      <select id="department_id" name="department_id" class="form-control">
        <option value="">-- Select Department (Optional) --</option>
        {% for dept in departments %}
          <option value="{{ dept.department_id }}">{{ dept.department_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Student</button>
      <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
