{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Edit Student Details</h1>
    <p class="page-subtitle">Update record for #{{ student.student_id }}: {{ student.first_name }} {{ student.last_name }}</p>
  </div>
  <div>
    <a href="{{ url_for('students') }}" class="btn btn-secondary">&larr; Back to Student List</a>
  </div>
</div>

<div class="card" style="max-width: 650px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('edit_student', student_id=student.student_id) }}">
    
    <div class="form-row">
      <div class="form-group">
        <label for="first_name" class="form-label">First Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="first_name" 
          name="first_name" 
          class="form-control" 
          required 
          value="{{ student.first_name }}"
        >
      </div>

      <div class="form-group">
        <label for="last_name" class="form-label">Last Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="last_name" 
          name="last_name" 
          class="form-control" 
          required 
          value="{{ student.last_name }}"
        >
      </div>
    </div>

    <div class="form-group">
      <label for="email" class="form-label">Email Address <span class="required">*</span></label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        class="form-control" 
        required 
        value="{{ student.email }}"
      >
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="phone" class="form-label">Phone Number</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          class="form-control" 
          value="{{ student.phone or '' }}"
        >
      </div>

      <div class="form-group">
        <label for="date_of_birth" class="form-label">Date of Birth</label>
        <input 
          type="date" 
          id="date_of_birth" 
          name="date_of_birth" 
          class="form-control" 
          value="{{ student.date_of_birth or '' }}"
        >
      </div>
    </div>

    <div class="form-group">
      <label for="department_id" class="form-label">Academic Department</label>
      <select id="department_id" name="department_id" class="form-control">
        <option value="">-- Select Department (Optional) --</option>
        {% for dept in departments %}
          <option 
            value="{{ dept.department_id }}"
            {% if student.department_id == dept.department_id %}selected{% endif %}
          >
            {{ dept.department_name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Update Student</button>
      <a href="{{ url_for('students') }}" class="btn btn-secondary">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
